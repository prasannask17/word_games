<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Games Book Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      min-height: 100vh;
      background: #f4f4f5;
      background-image:
        radial-gradient(#2b2b2b 0.75px, transparent 0.75px),
        radial-gradient(#2b2b2b 0.75px, #f4f4f5 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      padding: 2.5rem 1rem;
      color: #000000;
    }

    .container { max-width: 640px; margin: 0 auto; position: relative; }

    /* ── Header ── */
    h1 {
      text-align: center;
      font-size: 3.4rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: #000000;
      margin-bottom: 0.1rem;
      filter: drop-shadow(3px 3px 0px rgba(255,255,255,1));
      transform: rotate(-1deg);
    }
    .subtitle {
      text-align: center;
      font-family: 'Caveat', cursive;
      color: #2b2b2b;
      font-size: 1.6rem;
      margin-bottom: 2rem;
      font-weight: 700;
      transform: rotate(1deg);
    }

    /* ── Sketchy Card Bubble ── */
    .card {
      background: #ffffff;
      border: 3.5px solid #000000;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      padding: 1.8rem;
      box-shadow: 6px 6px 0px #000000;
      margin-bottom: 1.5rem;
      position: relative;
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
    }

    .section-label {
      font-size: 0.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #000000;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .section-label::before {
      content: "★";
      color: #000000;
      font-size: 1rem;
    }

    /* ── Theme input ── */
    .input-row { display: flex; gap: 0.6rem; margin-bottom: 1rem; }
    .theme-input {
      flex: 1;
      padding: 0.85rem 1.2rem;
      font-size: 1.15rem;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      border: 3.5px solid #000000;
      border-radius: 20px 255px 20px 255px/255px 20px 255px 20px;
      outline: none;
      background: #ffffff;
      color: #000000;
      box-shadow: inset 2px 3px 0px rgba(0,0,0,0.1);
      transition: all 0.2s;
    }
    .theme-input:focus {
      border-color: #000000;
      background: #fcfcfc;
      box-shadow: 3px 3px 0px #000000;
    }
    .theme-input::placeholder { color: #666; font-weight: 400; }

    /* ── Preset chips ── */
    .chips { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .chip {
      padding: 0.4rem 1rem;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      border: 3px solid #000000;
      color: #000000;
      background: #ffffff;
      box-shadow: 3px 3px 0px #000000;
      transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
    }
    .chip:hover {
      transform: translateY(-2px) rotate(-2deg);
      box-shadow: 4px 5px 0px #000000;
      background: #000000;
      color: #ffffff;
    }
    .chip:active { transform: translateY(1px); box-shadow: 1px 1px 0px #000000; }

    /* ── Game selector ── */
    .games-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
    }
    .toggle-all {
      font-size: 0.85rem;
      font-weight: 900;
      color: #000000;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      text-decoration: underline;
    }
    .toggle-all:hover { opacity: 0.7; }

    .games-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .game-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 0.9rem;
      border: 3px solid #000000;
      border-radius: 12px;
      cursor: pointer;
      background: #ffffff;
      box-shadow: 3px 3px 0px #000000;
      transition: all 0.15s;
      user-select: none;
    }
    .game-item:hover { background: #f4f4f4; transform: translateY(-1px); }
    .game-item.checked { border-color: #000000; background: #000000; color: #ffffff; box-shadow: 3px 3px 0px #000000; }
    .game-item.checked .game-name { color: #ffffff; }
    .game-item.checked .game-meta { color: #cccccc; }

    .game-item input[type="checkbox"] { display: none; }

    .game-check {
      width: 22px; height: 22px;
      border: 3px solid #000000;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      font-weight: 900;
      color: #000000;
      background: #ffffff;
      transition: background 0.15s, border-color 0.15s;
    }
    .game-item.checked .game-check {
      background: #ffffff;
      border-color: #ffffff;
      color: #000000;
    }
    .game-item.checked .game-check::after { content: "✓"; }

    .game-info { flex: 1; min-width: 0; }
    .game-name { font-size: 0.88rem; font-weight: 900; color: #000000; }
    .game-meta { font-size: 0.72rem; font-weight: 800; color: #444; margin-top: 1px; }

    .diff-easy   { color: #000000; font-weight: 900; }
    .diff-medium { color: #000000; font-weight: 900; }
    .diff-hard   { color: #000000; font-weight: 900; }
    .game-item.checked .diff-easy,
    .game-item.checked .diff-medium,
    .game-item.checked .diff-hard { color: #ffffff; }

    /* ── Scale slider ── */
    .scale-row { display: flex; align-items: center; gap: 0.8rem; }
    .scale-row label { font-size: 0.9rem; font-weight: 900; color: #000000; white-space: nowrap; }
    .scale-row input[type="range"] {
      flex: 1;
      accent-color: #000000;
      cursor: pointer;
      height: 8px;
    }
    .scale-badge {
      font-size: 0.85rem; font-weight: 900;
      background: #000000; color: #ffffff;
      border: 2.5px solid #000000;
      padding: 0.15rem 0.6rem; border-radius: 12px; min-width: 48px; text-align: center;
      box-shadow: 2px 2px 0px #000000;
    }
    .scale-hints { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 800; color: #444; margin-top: 0.4rem; }

    /* ── Generate button ── */
    .btn-go {
      width: 100%;
      padding: 1.1rem;
      font-size: 1.25rem;
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
      background: #000000;
      color: #ffffff;
      border: 3.5px solid #000000;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      cursor: pointer;
      box-shadow: 6px 6px 0px #555555;
      transition: all 0.1s ease;
      letter-spacing: 0.5px;
    }
    .btn-go:hover   { background: #222222; transform: translateY(-2px); box-shadow: 6px 8px 0px #000000; }
    .btn-go:active  { transform: translateY(2px); box-shadow: 2px 2px 0px #000000; }
    .btn-go:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── Loading ── */
    .spinner-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      padding: 1.2rem 0 0;
      color: #000000;
      font-weight: 800;
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
    }
    .spinner {
      width: 42px; height: 42px;
      border: 4px solid #ccc;
      border-top-color: #000000;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Messages ── */
    .msg {
      border: 3px solid #000000;
      border-radius: 14px;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-weight: 900;
      margin-top: 1rem;
      display: none;
      box-shadow: 3px 3px 0px #000000;
    }
    .msg-error   { background: #ffffff; color: #000000; }
    .msg-success { background: #000000; color: #ffffff; }
  </style>
</head>
<body>
<div class="container">
  <h1>WORD GAMES</h1>
  <p class="subtitle">★ Puzzle books for clever kids · ages 8–12 ★</p>

  <!-- ── Theme ───────────────────────────────────────────── -->
  <div class="card">
    <div class="section-label">Choose a Theme</div>
    <div class="input-row">
      <input class="theme-input" id="themeInput" type="text"
             placeholder="Type any theme… e.g. Cricket, Dinosaurs, Space"
             autocomplete="off" onkeydown="if(event.key==='Enter') generate()">
    </div>
    <div class="section-label" style="margin-bottom:0.5rem;">or pick a quick preset</div>
    <div class="chips" id="chips"></div>
  </div>

  <!-- ── Game types ───────────────────────────────────────── -->
  <div class="card">
    <div class="games-header">
      <div class="section-label" style="margin-bottom:0">Select games to include</div>
      <button class="toggle-all" id="toggleAllBtn" onclick="toggleAll()">Deselect all</button>
    </div>
    <div class="games-grid" id="gamesGrid"></div>
  </div>

  <!-- ── Scale ────────────────────────────────────────────── -->
  <div class="card">
    <div class="section-label">Book size</div>
    <div class="scale-row">
      <label>Scale</label>
      <input type="range" id="scale" min="0.5" max="2" step="0.1" value="1.0"
             oninput="document.getElementById('scaleBadge').textContent=this.value+'×'">
      <span class="scale-badge" id="scaleBadge">1.0×</span>
    </div>
    <div class="scale-hints">
      <span>~60 pages</span><span>~150 pages</span><span>~300 pages</span>
    </div>
  </div>

  <!-- ── Generate ─────────────────────────────────────────── -->
  <button class="btn-go" id="goBtn" onclick="generate()">✏️ Generate &amp; Download PDF 🚀</button>

  <div class="spinner-wrap" id="spinner">
    <div class="spinner"></div>
    <span id="spinnerMsg">Brewing up your puzzle book…</span>
  </div>
  <div class="msg msg-error"   id="errMsg"></div>
  <div class="msg msg-success" id="okMsg"></div>
</div>

<script>
let allGames = [];

// ── Load presets & games in parallel ──────────────────────
(async () => {
  const [themesData, gamesData] = await Promise.all([
    fetch('/api/themes').then(r => r.json()),
    fetch('/api/games').then(r => r.json()),
  ]);

  // Preset chips
  const chips = document.getElementById('chips');
  themesData.themes.forEach((t) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = t.name;
    b.onclick = () => { document.getElementById('themeInput').value = t.name; };
    chips.appendChild(b);
  });

  // Game checkboxes
  allGames = gamesData.games;
  const grid = document.getElementById('gamesGrid');
  allGames.forEach(g => {
    const item = document.createElement('div');
    item.className = 'game-item checked';
    item.dataset.key = g.key;
    item.innerHTML = `
      <div class="game-check"></div>
      <div class="game-info">
        <div class="game-name">${g.title}</div>
        <div class="game-meta">
          <span class="${DIFF_CLASS[g.diff] || ''}">${g.diff}</span>
        </div>
      </div>
    `;
    item.addEventListener('click', () => {
      const isChecked = item.classList.contains('checked');
      item.classList.toggle('checked', !isChecked);
      updateToggleAllBtn();
    });
    grid.appendChild(item);
  });
})();

const DIFF_CLASS = { EASY: 'diff-easy', MEDIUM: 'diff-medium', HARD: 'diff-hard' };

// ── Toggle all ────────────────────────────────────────────
function toggleAll() {
  const items = document.querySelectorAll('.game-item');
  const allChecked = [...items].every(i => i.classList.contains('checked'));
  items.forEach(item => item.classList.toggle('checked', !allChecked));
  updateToggleAllBtn();
}

function updateToggleAllBtn() {
  const items = document.querySelectorAll('.game-item');
  const allChecked = [...items].every(i => i.classList.contains('checked'));
  document.getElementById('toggleAllBtn').textContent = allChecked ? 'Deselect all' : 'Select all';
}

// ── Generate ──────────────────────────────────────────────
async function generate() {
  const theme = document.getElementById('themeInput').value.trim();
  const errMsg  = document.getElementById('errMsg');
  const okMsg   = document.getElementById('okMsg');
  const spinner = document.getElementById('spinner');
  const btn     = document.getElementById('goBtn');

  errMsg.style.display = 'none';
  okMsg.style.display  = 'none';

  if (!theme) {
    errMsg.textContent   = '❌ Please type a theme name first!';
    errMsg.style.display = 'block';
    document.getElementById('themeInput').focus();
    return;
  }

  const selectedGames = [...document.querySelectorAll('.game-item.checked')]
    .map(item => item.dataset.key);

  if (selectedGames.length === 0) {
    errMsg.textContent   = '❌ Please select at least one game type.';
    errMsg.style.display = 'block';
    return;
  }

  btn.disabled = true;
  spinner.style.display = 'flex';
  document.getElementById('spinnerMsg').textContent =
    `Drawing & assembling your "${theme}" book... Grab a pencil! ✏️`;

  const form = new FormData();
  form.append('theme', theme);
  form.append('scale', document.getElementById('scale').value);
  form.append('games', selectedGames.join(','));

  try {
    const res = await fetch('/api/generate', { method: 'POST', body: form });

    if (res.ok) {
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('pdf')) {
        const blob = await res.blob();
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        const cd   = res.headers.get('content-disposition') || '';
        a.download = cd.match(/filename="?([^";\n]+)"?/)?.[1]?.trim() || `Word_Games_${theme}.pdf`;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        okMsg.textContent   = `✅ Hooray! "${theme}" PDF downloaded successfully! 🎉`;
        okMsg.style.display = 'block';
      } else {
        const text = await res.text();
        let msg = 'Generation failed.';
        try { msg = JSON.parse(text).error || msg; } catch(_) { msg = text || msg; }
        errMsg.textContent   = `❌ ${msg}`;
        errMsg.style.display = 'block';
      }
    } else {
      const text = await res.text();
      let msg = `Server error ${res.status}`;
      try { msg = JSON.parse(text).error || msg; } catch(_) {}
      errMsg.textContent   = `❌ ${msg}`;
      errMsg.style.display = 'block';
    }
  } catch (e) {
    errMsg.textContent   = `❌ ${e.message}`;
    errMsg.style.display = 'block';
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
  }
}
</script>
</body>
</html>
